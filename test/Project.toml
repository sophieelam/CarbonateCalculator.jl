# Development dependencies. A user installing CarbonateCalculator gets the root
# Project.toml only and needs none of these.
#
# This is what blocks 1 and 2 of the suite need — i.e. what `Pkg.test()` requires. Block 3
# (CC_TESTS=all) additionally uses ZipFile, and CC_PLOTS=true uses Plots. Both are left out
# on purpose: they are heavy, both are opt-in, and `optional_using` in
# test/field_data/field_data_common.jl degrades to a warning naming the install command
# rather than failing. Add them only if you run block 3:
#
#     julia --project=test -e 'using Pkg; Pkg.add(["ZipFile", "Plots"])'
#
# CarbonateCalculator is dev-linked to `..` so `julia --project=test test/runtests.jl` runs
# without going through Pkg.test.

[deps]
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
CarbonateCalculator = "a2b7c4d9-8e12-4f33-b1a9-9c8d7e6f5a4b"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Downloads = "f43a241f-c20a-4ad4-852c-f6b1247861c6"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
